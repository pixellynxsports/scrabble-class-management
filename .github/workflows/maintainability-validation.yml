name: Maintainability Validation

on:
  push:
    branches:
      - main
      - refactor/maintainability-safe
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./tests/*" -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Run critical regression tests
        run: node --test tests/core-rules.test.js
      - name: Validate local HTML references
        run: node scripts/validate-references.mjs
