# Supabase Edge Function configuration for Billplz integration.
# create-class-payment is called by a signed-in parent.
[functions.create-class-payment]
verify_jwt = true

# Billplz calls this endpoint directly and does not send a Supabase JWT.
# The function verifies Billplz's X Signature before changing payment data.
[functions.billplz-callback]
verify_jwt = false

[functions.submit-order-payment-proof]
verify_jwt = true

[functions.get-order-payment-receipt]
verify_jwt = true


# Public registration submission. The function validates new parent data and existing parent sessions itself.
[functions.submit-student-registration]
verify_jwt = false

# Teacher-only registration review. The function validates the caller against parent_accounts.
[functions.review-student-registration]
verify_jwt = true
